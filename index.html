<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salina Rally Transcript</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#b00020; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#e8e8e8; --muted:#999; --accent:#ff6b6b; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; margin:0 auto; max-width:820px; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  #status { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  #live { color:var(--accent); font-weight:600; }
  pre { white-space:pre-wrap; word-wrap:break-word; font:inherit; margin:0; }
</style>
</head>
<body>
<h1>Trump midterm rally, Salina, Kansas, Nov 1, 2026: live transcript</h1>
<div id="status"><span id="live">● LIVE</span> Machine transcript (Whisper), running 1–3 minutes behind. Times are Eastern. Speaker labels are best-effort. <span id="updated"></span></div>
<pre id="t">Loading…</pre>
<script>
  async function load() {
    try {
      const r = await fetch('transcript.txt?ts=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const text = await r.text();
      const el = document.getElementById('t');
      const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 200;
      if (el.textContent !== text) {
        el.textContent = text || '(Waiting for the program to start…)';
        if (nearBottom) window.scrollTo(0, document.body.scrollHeight);
      }
      document.getElementById('updated').textContent = 'Checked ' + new Date().toLocaleTimeString() + '.';
    } catch (e) {}
  }
  load(); setInterval(load, 20000);
</script>
</body>
</html>
